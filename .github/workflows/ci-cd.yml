name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test Python and build dashboard
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            collector/requirements.txt
            ml/requirements.txt
      - name: Install and test
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/ruff check backend collector ml infra
          .venv/bin/pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Compile eBPF on the configured VM
        if: runner.arch == 'ARM64'
        run: make -C ebpf-agent

  deploy:
    name: Build and deploy on EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 20
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      REGISTRY: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure pinned SSH host and release archive
        run: |
          set -euo pipefail
          test -n "$REGISTRY" && test -n "$EC2_KNOWN_HOSTS"
          [[ "$REGISTRY" =~ ^[a-z0-9][a-z0-9_-]+$ ]]
          mkdir -p "$RUNNER_TEMP/ebpf-ssh"
          chmod 700 "$RUNNER_TEMP/ebpf-ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ebpf-ssh/key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$RUNNER_TEMP/ebpf-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ebpf-ssh/key"
          git archive --format=tar.gz -o "$RUNNER_TEMP/release.tgz" HEAD
      - name: Upload verified source
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ebpf-ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ebpf-ssh/known_hosts" -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" "mkdir -p /home/ubuntu/ebpf-releases/$GITHUB_SHA"
          scp -i "$RUNNER_TEMP/ebpf-ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ebpf-ssh/known_hosts" -o StrictHostKeyChecking=yes "$RUNNER_TEMP/release.tgz" "$EC2_USER@$EC2_HOST:/home/ubuntu/ebpf-releases/$GITHUB_SHA/source.tgz"
      - name: Registry login on EC2
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -i "$RUNNER_TEMP/ebpf-ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ebpf-ssh/known_hosts" -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" "docker login -u '$REGISTRY' --password-stdin"
      - name: Build amd64 images and deploy the exact commit
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ebpf-ssh/key" -o UserKnownHostsFile="$RUNNER_TEMP/ebpf-ssh/known_hosts" -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" bash -s -- "$GITHUB_SHA" "$REGISTRY" <<'REMOTE'
          set -euo pipefail
          export IMAGE_TAG="$1" DOCKERHUB_USERNAME="$2"
          cd "/home/ubuntu/ebpf-releases/$IMAGE_TAG"
          tar -xzf source.tgz
          test -s /home/ubuntu/ebpf-project/.env
          ln -sfn /home/ubuntu/ebpf-project/.env .env
          mkdir -p ml
          ln -sfn /home/ubuntu/ebpf-project/ml/models ml/models
          docker compose -p ebpf-trace-app -f docker-compose.yml -f docker-compose.tunnel.yml config --quiet
          docker compose -p ebpf-trace-app -f docker-compose.yml -f docker-compose.tunnel.yml build
          docker compose -p ebpf-trace-app -f docker-compose.yml -f docker-compose.tunnel.yml push backend frontend
          bash infra/deploy.sh
          ln -sfn "/home/ubuntu/ebpf-releases/$IMAGE_TAG" /home/ubuntu/ebpf-current
          REMOTE
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ebpf-ssh/key" "$RUNNER_TEMP/ebpf-ssh/known_hosts"
