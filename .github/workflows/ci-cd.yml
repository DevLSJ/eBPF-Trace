name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
    paths-ignore: ['docs/**', 'README.md', 'mock/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test backend and build dashboard
    runs-on: ubuntu-latest
    # e2e grew to 739 tests (2 workers on CI, about 20 minutes alone); 20 cancelled the job mid-e2e on PR #12
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet, test and static-build backend
        working-directory: backend
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=linux go vet ./...
          go test -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/healthcheck
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint and build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      # 10/20: React e2e(Playwright, 가짜 백엔드 — 실제 서버 없이 Vite 만 띄움). 실패하면 보고서를 올린다
      - name: Dashboard e2e
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Validate compose files
        run: |
          set -euo pipefail
          printf 'POSTGRES_DB=ci\nPOSTGRES_USER=ci\nPOSTGRES_PASSWORD=ci-only\nPUBLIC_HOST=example.invalid\n' > .env
          docker compose -p supplyguard --project-directory . -f deploy/docker-compose.yml config --quiet
          docker compose -p supplyguard --project-directory . -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml config --quiet
          docker compose -p supplyguard --project-directory . -f deploy/docker-compose.yml -f deploy/docker-compose.mock.yml config --quiet
          rm -f .env

  images:
    name: Build images off the production server
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and push amd64 release images
        run: |
          set -euo pipefail
          # 레지스트리 secret 이 없으면 빌드 · 기동 확인만 하고 push 는 건너뛴다(11/05 — 지금 배포는 SSH 로 이미지 전송)
          PUSH=1
          if [ -z "$REGISTRY" ] || [ -z "$DOCKERHUB_TOKEN" ]; then PUSH=0; REGISTRY=local; echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN 없음 — 이미지 빌드 · 기동 확인만, push 생략"; fi
          [ "$PUSH" = 1 ] && printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$REGISTRY" --password-stdin
          docker build --pull -f deploy/Dockerfile.backend --build-context eval-reports=bench/reports --build-context sg-tools=tools -t "$REGISTRY/supplyguard-backend:$GITHUB_SHA" backend
          docker build --pull -f deploy/Dockerfile.frontend -t "$REGISTRY/supplyguard-frontend:$GITHUB_SHA" frontend
          # 이미지가 실제로 기동하는지: mock 소스로 띄워 /health 확인
          cid=$(docker run -d -e EVENT_SOURCE=mock -e ADMIN_INITIAL_PASSWORD=ci-only-pass-1 "$REGISTRY/supplyguard-backend:$GITHUB_SHA")
          for i in $(seq 1 15); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ]; then break; fi
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' "$cid" | grep -qx healthy
          docker rm -f "$cid" >/dev/null
          if [ "$PUSH" = 1 ]; then
            docker push "$REGISTRY/supplyguard-backend:$GITHUB_SHA"
            docker push "$REGISTRY/supplyguard-frontend:$GITHUB_SHA"
          fi
      - name: Remove registry credentials
        if: always()
        run: docker logout
