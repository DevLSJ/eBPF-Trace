# frontend 컨테이너 내부 nginx — 빌드된 SPA 정적 서빙 (외부 nginx 가 / 를 여기로 넘긴다)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
