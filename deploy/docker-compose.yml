# SupplyGuard 운영 스택 (EC2 단일 호스트). 저장소 루트에서 실행한다:
#   docker compose -p supplyguard --project-directory . -f deploy/docker-compose.yml up -d
# 또는 deploy/compose.sh (같은 명령을 감싼 것). 변수는 루트 .env 에서 읽는다.
services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/supplyguard-backend:${IMAGE_TAG:-dev}
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
    env_file:
      - path: .env
        required: false   # 없으면 compose 변수 기본값만으로 뜬다 (CI config 검증)
    environment:
      BACKEND_PORT: "8000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      POLICY_FILE: /policies/default.yaml
      # Inspektor Gadget: 호스트 루트를 /host 로 보고 bpffs·tracefs를 알아서 마운트한다
      HOST_ROOT: /host
      DOCKER_HOST: unix:///var/run/docker.sock
    # eBPF 로드·호스트 PID 네임스페이스·컨테이너 메타데이터·Docker kill 에 필요한 권한.
    # 자기 스택은 IGNORE_CONTAINERS=supplyguard-* 로 관찰 대상에서 빠진다.
    privileged: true
    pid: host
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/bpf:/sys/fs/bpf
      - ig_store:/var/lib/ig
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/supplyguard-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: ../deploy/Dockerfile.frontend
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 외부 포트 바인딩 없음 — Docker 내부 네트워크만 접근 가능

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 외부 포트 바인딩 없음 — Docker 내부 네트워크만 접근 가능

volumes:
  postgres17_data:
  redis_data:
  ig_store:
