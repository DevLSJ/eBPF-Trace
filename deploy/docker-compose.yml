# SupplyGuard 운영 스택 (단일 호스트 · sg-vm · sg-ec2). 저장소 루트에서 실행한다:
#   docker compose -p supplyguard --project-directory . -f deploy/docker-compose.yml up -d
# 또는 deploy/compose.sh (같은 명령을 감싼 것). 변수 · 비밀값은 루트 .env 에서 읽는다(.env.example 참고).
#
# ── 처리 과정 ───────────────────────────────────────────────────────────────
#   커널 syscall ─▶ eBPF 가젯(Inspektor Gadget v0.56.1: exec · open · connect · trace_dns)
#     ─▶ backend 수집(컨테이너 발견 auto: fanotify, 안 되면 docker-events)
#     ─▶ 정책 판정(YAML: 단일 · dns · 연쇄 규칙) ─▶ 위반이면 증거 수집(≤0.7초) ─▶ Docker API kill + 웹훅/Slack
#     ─▶ redis(실시간 버퍼) ─▶ WebSocket ─▶ 화면(React)
#     ─▶ postgres(감사 로그 · 건 · 정책 변경 이력 · 차단 목록 · 계정 · 분 단위 수집량)
#   설치 검사: tools/sg-install 이 sg-install-* 컨테이너에서 설치 → 같은 엔진이 감시 · 격리 + 같은 패키지 정적 검사 자동 시작
#   공급망 검사: backend 가 검사기 컨테이너(GuardDog · OSV-Scanner)를 그때그때 띄움(scan_work 볼륨 공유)
#   시연(DEMO_ENABLED=true): backend 가 Docker API 로 sg-install-demo-* 컨테이너를 띄워 benign · chain · all 재생
#   AI 도우미: backend ─▶ Claude API(기본, ANTHROPIC_API_KEY) · 닿지 않으면 ollama(예비, --profile ai). 읽기 전용 조회 → 사실 문장 → 답
#
# ── 서비스 ─────────────────────────────────────────────────────────────────
#   nginx     :80 입구. /api · /ws → backend, 나머지 → frontend
#   backend   Go 1.26. 가젯 실행 · 판정 · 격리 · REST/WS · 로그인(쿠키 세션 · OTP · 역할) · 검사 · 시연 · AI 도우미
#   frontend  React 18 + Vite 빌드 결과(정적 파일)
#   postgres  17. 감사 · 정책 · 계정 저장(외부 포트 없음)
#   redis     7. 실시간 이벤트 버퍼(외부 포트 없음)
#   ollama    선택(--profile ai). 서버 안에서만 도는 예비 AI 모델
services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/supplyguard-backend:${IMAGE_TAG:-dev}
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
      # 평가 결과 JSON(GET /api/evaluation)을 이미지에 넣는다 — 컨텍스트(backend/) 밖이라 이름 붙은 컨텍스트로
      additional_contexts:
        eval-reports: ./bench/reports
        sg-tools: ./tools # 설치 검사 「사용 방법」 내려받기(11/09)
    env_file:
      - path: .env
        required: false   # 없으면 compose 변수 기본값만으로 뜬다 (CI config 검증)
    environment:
      BACKEND_PORT: "8000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      POLICY_FILE: /policies/default.yaml
      # Inspektor Gadget: 호스트 루트를 /host 로 보고 bpffs·tracefs를 알아서 마운트한다
      HOST_ROOT: /host
      DOCKER_HOST: unix:///var/run/docker.sock
      # AI 도우미(11/09): 기본 Claude, 예비 Ollama. auto = 키가 있으면 Claude · 없으면 Ollama, ollama = 서버 밖으로 보내지 않음.
      # ANTHROPIC_API_KEY 값은 .env 에만 둔다(이 파일 · 저장소에 넣지 않음)
      CHAT_PROVIDER: ${CHAT_PROVIDER:-auto}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-low}
    # eBPF 로드·호스트 PID 네임스페이스·컨테이너 메타데이터·Docker kill 에 필요한 권한.
    # 자기 스택은 IGNORE_CONTAINERS=supplyguard-* 로 관찰 대상에서 빠진다.
    privileged: true
    pid: host
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/bpf:/sys/fs/bpf
      - ig_store:/var/lib/ig
      # 공급망 검사(10/16) 작업 볼륨 — 검사기 컨테이너가 같은 볼륨을 /work 로 읽기 전용 마운트(이름: <프로젝트>_scan_work = SCAN_VOLUME)
      - scan_work:/scan
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/supplyguard-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: ../deploy/Dockerfile.frontend
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 외부 포트 바인딩 없음 — Docker 내부 네트워크만 접근 가능

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 외부 포트 바인딩 없음 — Docker 내부 네트워크만 접근 가능

  # AI 도우미 예비 모델(10/20 · 11/09 부터 기본은 Claude API, 이건 예비) — `--profile ai` 로만 뜬다(메모리 작은 EC2 는 끄고 운영).
  # 켜면 .env 에 OLLAMA_URL=http://ollama:11434. Claude 가 닿지 않거나 CHAT_PROVIDER=ollama 일 때 쓴다. 모델은 볼륨에 한 번 받아 둔다: docker compose exec ollama ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # 외부 포트 없음 — backend 만 http://ollama:11434 로 부른다

volumes:
  scan_work:
  ollama_data:
  postgres17_data:
  redis_data:
  ig_store:
