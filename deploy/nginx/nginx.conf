# 공개 리버스 프록시 (80). eBPF-project 와 같은 라우팅: /api·/health·/ws → backend:8000, 나머지 → frontend:80
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /var/log/nginx/access.log safe;
    server {
        listen 80;
        client_max_body_size 256k;   # 정책 YAML 전체 교체(PUT /api/policies) 본문
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /health { proxy_pass http://backend:8000; }
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 75s;   # 백엔드 ping 주기보다 길게
            proxy_send_timeout 75s;
            proxy_buffering off;
        }
        location / { proxy_pass http://frontend:80; }
    }
}
