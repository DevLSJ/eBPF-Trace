# 로컬 개발(11/09 사용자 결정 — make dev): Postgres · Redis + 실제 가젯 백엔드(Docker Desktop 안, 127.0.0.1:8000). 화면은 Vite :5173 이 프록시한다.
#   make dev            # 이 파일로 DB · 백엔드를 올리고(--build --wait) Vite :5173 을 띄운다. Ctrl-C 면 백엔드만 멈춘다(DB 는 남김)
#   make dev-mock       # 예전처럼 mock 이벤트 · go run(Docker 없이 빠른 화면 개발)
#   DB 를 직접 볼 때: postgres://supplyguard:supplyguard-dev@127.0.0.1:25433/supplyguard?sslmode=disable · redis://127.0.0.1:26380
# 옛 캡스톤/eBPF-project 의 개발 DB 가 25432 · 26379 를 써서 25433 · 26380 으로 옮겼다(11/09, DEV_PG_PORT · DEV_REDIS_PORT 로 바꿈).
# 비밀값(ANTHROPIC_API_KEY · AUTH_SECRET_KEY · ADMIN_TOKEN · SANDBOX_TOKEN)은 저장소 루트 .env.local(gitignore · 600) — make dev 가 없는 값을 만든다.
#
# ── 구성(make dev 한 번이면 아래가 다 뜬다) ─────────────────────────────────
#   화면      Vite 개발 서버 http://localhost:5173 (이 파일 밖, make dev 가 호스트에서 띄움 · /api · /ws 를 backend 로 프록시)
#   backend   실제 eBPF 가젯 백엔드 127.0.0.1:8000 (운영과 같은 이미지 · 권한) · 로그인 admin/admin(개발 전용) + OTP
#   postgres  127.0.0.1:25433 · redis 127.0.0.1:26380 (개발 DB, 볼륨은 make dev-down 뒤에도 남음)
#   AI 도우미 Claude API(claude-opus-5-5, .env.local 의 ANTHROPIC_API_KEY) · 바꾸려면 .env.local 에 CHAT_PROVIDER · CLAUDE_MODEL
# ── 처리 과정 ───────────────────────────────────────────────────────────────
#   커널 syscall ─▶ eBPF 가젯(exec · open · connect · trace_dns) ─▶ backend 수집(Docker Desktop: docker-events)
#     ─▶ 정책 판정(YAML) ─▶ 위반이면 증거 수집 ─▶ 격리(Docker API kill, sg-install-* · 시연 · enforce 라벨만)
#     ─▶ redis ─▶ WebSocket ─▶ 화면 :5173   ·   postgres 에 감사 · 정책 · 계정 · 분 단위 수집량(같은 1분 반복은 1건)
#   시연 · 공급망 검사 · 연결 테스트 컨테이너는 backend 가 Docker API 로 그때그때 띄운다
name: supplyguard-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: supplyguard
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-supplyguard-dev}
      POSTGRES_DB: supplyguard
    ports: ["127.0.0.1:${DEV_PG_PORT:-25433}:5432"]
    volumes: ["postgres_dev_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplyguard -d supplyguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${DEV_REDIS_PORT:-26380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 실제 가젯 백엔드 — 운영 compose 의 backend 와 같은 권한 · 마운트. Docker Desktop 은 fanotify 가 없어 발견은 docker-events
  # (컨테이너 시작 직후 약 0.1초 안의 동작은 놓칠 수 있음). 감시는 전체, 격리는 sg-install-* · 시연 · supplyguard.enforce 라벨만(11/06)
  backend:
    image: local/supplyguard-backend:dev-local
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
      additional_contexts:
        eval-reports: ../bench/reports
        sg-tools: ../tools
    env_file:
      - path: ../.env.local
        required: true
    environment:
      BACKEND_PORT: "8000"
      EVENT_SOURCE: gadget
      RESOLVE_DNS: "true"
      CONTAINER_DISCOVERY: auto
      WATCH_CONTAINERS: ""
      IGNORE_CONTAINERS: supplyguard-*
      ENFORCE_KILL: "true"
      DEMO_ENABLED: "true"
      # 개발 전용 로그인 admin/admin(비밀번호 변경 단계 없음) — 가젯 소스에서는 LOCAL_DEV=true 가 함께 있어야 시작한다(Tier 1, 11/09)
      AUTH_DEV_MODE: "true"
      LOCAL_DEV: "true"
      ADMIN_USER: admin
      ADMIN_INITIAL_PASSWORD: admin
      AUTH_OTP_REQUIRED: "true"
      AUTH_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PUBLIC_URL: http://localhost:5173
      DATABASE_URL: postgres://supplyguard:${DEV_POSTGRES_PASSWORD:-supplyguard-dev}@postgres:5432/supplyguard?sslmode=disable
      REDIS_URL: redis://redis:6379
      POLICY_FILE: /policies/default.yaml
      HOST_ROOT: /host
      DOCKER_HOST: unix:///var/run/docker.sock
      SCAN_VOLUME: supplyguard-dev_scan_work
      SG_INSTALL_API: http://127.0.0.1:8000
    privileged: true
    pid: host
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/bpf:/sys/fs/bpf
      - ig_store:/var/lib/ig
      - scan_work:/scan
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_dev_data:
  ig_store:
  scan_work:
