name: ebpf-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ebpf_test
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD}
      POSTGRES_DB: ebpf_test
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["postgres_test_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebpf_test -d ebpf_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:26379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_test_data:
