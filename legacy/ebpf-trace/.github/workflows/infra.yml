name: Terraform
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the saved plan (creates a new billable EC2/VPC)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: ebpf-terraform
  cancel-in-progress: false
jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: infrastructure
    env:
      TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
      TF_VAR_key_name: ${{ vars.EC2_KEY_NAME }}
      TF_VAR_region: ap-southeast-2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Initialize shared state
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=ebpf-trace/terraform.tfstate" -backend-config="region=ap-southeast-2" -backend-config="use_lockfile=true"
          terraform validate
          terraform plan -out=deployment.tfplan
      - name: Apply saved plan
        if: inputs.apply
        working-directory: infra
        run: terraform apply deployment.tfplan
