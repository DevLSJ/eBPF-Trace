# 일반 룰 (docs/03 §3.2 상단 표). 모든 정규식은 추가 라인(+)에만 적용(target: removed 제외).
# 심각도 가중치: LOW 5 · MEDIUM 15 · HIGH 30 · CRITICAL 50. 파일 배수·반복 보정은 app/static/engine.py.

# ---------- 외부 연결 (C2_CONNECTION) ----------
- id: NET_RAW_IP_URL
  category: C2_CONNECTION
  severity: HIGH
  languages: [JS, PY, SHELL, CONFIG, OTHER, MAKE]
  # IPv4·IPv6 리터럴 URL, 계정이 붙은 URL(root@IP)
  pattern: '\b(?:https?|wss?|tcp|ftp|ssh)://(?:[\w.%-]+(?::[^@\s/]*)?@)?(?:(?:\d{1,3}\.){3}\d{1,3}\b|\[[0-9a-fA-F:]{2,}\])'
  exclude_pattern: '://(?:[^@\s/]*@)?(?:127\.|0\.0\.0\.0|10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.|169\.254\.|\[::1?\]|\[fe80:|8\.8\.8\.8|8\.8\.4\.4|1\.1\.1\.1|1\.0\.0\.1)'
  description_ko: "도메인 없이 IP 주소로 직접 접속하는 URL (C2 서버 의심)"
  false_positive_hint: "로컬호스트·사설 대역·공용 DNS(8.8.8.8, 1.1.1.1)는 제외"

- id: NET_SUSPICIOUS_TLD
  category: C2_CONNECTION
  severity: MEDIUM
  languages: [JS, PY, SHELL, CONFIG, OTHER, MAKE]
  # 악용이 잦은 TLD(호스트의 끝) · 무료 터널/동적 DNS · 단축 URL · IP 로거 · 공인 IP 조회(정찰)
  pattern: 'https?://[\w.-]+\.(?:xyz|top|tk|pw|su|gq|ml|cf|ga|zip|ru|cn)(?=[/:''"`\s?#)]|$)|[\w-]+\.(?:ngrok(?:-free)?\.(?:io|app|dev)|duckdns\.org|no-ip\.(?:org|com|biz)|ddns\.net|serveo\.net|trycloudflare\.com|workers\.dev)\b|\b(?:bit\.ly|tinyurl\.com|is\.gd|t\.ly|cutt\.ly|rb\.gy|grabify\.link|iplogger\.(?:org|com)|2no\.co)/|\b(?:api\.ipify\.org|ipinfo\.io|ifconfig\.me|icanhazip\.com|ip\.me|checkip\.amazonaws\.com)\b'
  # 주석·문서 링크·package.json 작성자 메타는 제외
  exclude_pattern: '^\s*(?:#|//|\*)|<https?://[^>]+>`|"(?:author|homepage|url|email|bugs|funding|contributors|maintainers)"\s*:|<[^>\s]+@[^>\s]+>'
  description_ko: "악용이 잦은 도메인·무료 터널·단축 URL·IP 조회 서비스로의 접속"
  false_positive_hint: "주석·문서 링크·작성자 정보는 제외. 단독으로는 주의(MEDIUM)"

- id: NET_OUTBOUND_IN_INSTALL
  category: C2_CONNECTION
  severity: CRITICAL
  languages: [JS, PY, SHELL]
  path_pattern: '(?:^|/)(?:setup\.py|install\.(?:js|cjs|mjs|sh|py)|(?:pre|post)install\.(?:js|cjs|mjs|sh|py))$'
  pattern: '\bfetch\(|\baxios\b|\bhttps?\.(?:request|get)\(|urllib\.request|\burlopen\(|\brequests\.(?:get|post|put)\(|http\.client|\bcurl\s|\bwget\s|\bsocket\.connect|\bnet\.connect\('
  description_ko: "설치 스크립트(setup.py·install 훅) 안에서 외부 네트워크 호출"
  false_positive_hint: "네이티브 바이너리 다운로드 설치 스크립트(node-gyp 등)는 정상일 수 있음 — LLM 판단"

- id: NET_WEBHOOK_ENDPOINT
  category: C2_CONNECTION
  severity: HIGH
  languages: [JS, PY, SHELL, CONFIG, OTHER, MAKE]
  pattern: 'discord(?:app)?\.com/api/webhooks/|hooks\.slack\.com/services/|api\.telegram\.org/bot|pastebin\.com/(?:raw|api)|\btransfer\.sh\b|webhook\.site|requestbin|pipedream\.net|\binteract\.sh\b|burpcollaborator'
  description_ko: "웹훅·붙여넣기 서비스 등 데이터 수집에 자주 쓰이는 엔드포인트"
  false_positive_hint: "알림 기능 구현(정식 Slack 연동) 문서·설정은 정상일 수 있음"

- id: NET_OUTBOUND_CALL
  category: C2_CONNECTION
  severity: LOW
  languages: [JS, PY, SHELL]
  pattern: '\bfetch\(|\baxios\.(?:post|get|put|request)\(|\bhttps?\.request\(|\brequests\.(?:post|put|get)\(|\burlopen\(|\bhttpx\.(?:post|get|put)\(|\bnet\.connect\(|\.connect\(\(|\bcurl\s+-|\bwget\s+'
  description_ko: "외부 네트워크 호출 (단독으로는 정상 — 다른 신호와 결합 판단용 보조 룰)"
  false_positive_hint: "대부분 정상 기능. 태그를 만들지 않고 결합 룰(ENV_PLUS_NET)의 재료로만 쓴다"

# ---------- 정보 수집 (ENV_EXFILTRATION / CREDENTIAL_ACCESS) ----------
- id: ENV_ACCESS_BULK
  category: ENV_EXFILTRATION
  severity: MEDIUM
  languages: [JS, PY, SHELL]
  # 환경변수 전체를 문자열로 직렬화하거나 요청 본문으로 넘김 (필터링·하위 프로세스용 복사는 제외)
  pattern: 'JSON\.stringify\(\s*(?:\{\s*\.\.\.)?\s*process\.env\b|\bjson\.dumps\(\s*(?:dict\()?\s*os\.environ\b|\bstr\(\s*(?:dict\()?\s*os\.environ\s*\)|\b(?:data|json|params|body|payload)\s*[=:]\s*(?:dict\()?\s*(?:os\.environ|process\.env)\s*[,)}\n]|\bprintenv\s*(?:>|\|)|(?:^|[;&|]\s*)env\s*(?:>|\|)'
  description_ko: "환경변수 전체를 문자열로 직렬화하거나 요청 본문으로 보냄"
  false_positive_hint: "필터링·하위 프로세스용 환경 복사는 해당 없음. 외부 전송과 결합되면 위험"

- id: ENV_ACCESS_SECRET_KEY
  category: CREDENTIAL_ACCESS
  severity: HIGH
  languages: [JS, PY, SHELL]
  # 패키지 코드가 읽을 이유가 거의 없는 클라우드·CI·레지스트리 토큰
  pattern: '(?:process\.env|os\.environ(?:\.get)?|os\.getenv|getenv)\s*[\[(.]\s*[''"]?(?:AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|AWS_SESSION_TOKEN|GITHUB_TOKEN|GH_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|PYPI_TOKEN|PYPI_API_TOKEN|TWINE_PASSWORD|CI_JOB_TOKEN|GITLAB_TOKEN|AZURE_CLIENT_SECRET|GOOGLE_APPLICATION_CREDENTIALS|DOCKER_PASSWORD|SSH_PRIVATE_KEY)\b'
  description_ko: "클라우드·CI·패키지 레지스트리 토큰 환경변수 참조"
  false_positive_hint: "배포 스크립트·CI 도구는 정상일 수 있음 — 외부 전송 결합 여부가 핵심"

- id: ENV_ACCESS_APP_KEY
  category: CREDENTIAL_ACCESS
  severity: LOW
  languages: [JS, PY, SHELL]
  # 앱이 자기 설정 키를 읽는 일반 패턴 — 결합 판단용 보조 룰
  pattern: '(?:process\.env|os\.environ(?:\.get)?|os\.getenv|getenv)\s*[\[(.]\s*[''"]?(?:[A-Z_]*PRIVATE_KEY|[A-Z_]*PASSWORD|[A-Z_]*API_KEY|[A-Z_]*SECRET(?:_KEY)?|[A-Z_]*TOKEN)\b'
  description_ko: "API 키·비밀번호류 환경변수 참조 (단독으로는 정상 — 결합 판단용 보조 룰)"
  false_positive_hint: "SDK가 자기 키를 읽는 것은 정상. 태그를 만들지 않는다"

- id: FS_SENSITIVE_PATH
  category: CREDENTIAL_ACCESS
  severity: HIGH
  languages: [JS, PY, SHELL, OTHER]
  pattern: '\.ssh[\\/]+id_[a-z0-9]+|\.ssh[\\/]+authorized_keys|\.aws[\\/]+credentials|\.npmrc\b|\.pypirc\b|\.docker[\\/]+config\.json|\.git-credentials|\.kube[\\/]+config|/etc/shadow\b|/etc/passwd\b|(?:Google[\\/]+Chrome|BraveSoftware|Microsoft[\\/]+Edge|Opera Software)[\\/]+[^''"\n]{0,30}(?:User Data|Login Data|Cookies)|Login Data[''"]|Local State[''"]|\.mozilla[\\/]+firefox|discord(?:canary|ptb)?[\\/]+Local Storage|Local Storage[\\/]+leveldb'
  exclude_pattern: '^\s*(?://|#)'
  description_ko: "SSH 키·클라우드 자격증명·레지스트리 토큰·브라우저/메신저 저장소 등 민감 파일 경로 접근"
  false_positive_hint: "주석의 경로 언급은 제외. 배포 스크립트가 .npmrc를 쓰는 경우는 LLM 판단"

- id: ENV_PLUS_NET
  category: ENV_EXFILTRATION
  severity: CRITICAL
  mode: combo
  languages: [JS, PY, SHELL, OTHER]
  combos:
    # 환경변수 전체·민감 파일 수집 + 어떤 외부 호출이든
    - all: [[ENV_ACCESS_BULK, FS_SENSITIVE_PATH], [NET_OUTBOUND_CALL, NET_RAW_IP_URL, NET_SUSPICIOUS_TLD, NET_WEBHOOK_ENDPOINT, NET_OUTBOUND_IN_INSTALL]]
    # 토큰 참조 + 의심 목적지 (정상 API 호출의 Authorization 헤더 사용은 제외하려고 일반 호출과는 묶지 않음)
    - all: [[ENV_ACCESS_SECRET_KEY, ENV_ACCESS_APP_KEY], [NET_RAW_IP_URL, NET_SUSPICIOUS_TLD, NET_WEBHOOK_ENDPOINT, NET_OUTBOUND_IN_INSTALL]]
    # 호스트·사용자 정보 수집 + 의심 목적지
    - all: [[SYSINFO_COLLECT], [NET_RAW_IP_URL, NET_SUSPICIOUS_TLD, NET_WEBHOOK_ENDPOINT, NET_OUTBOUND_IN_INSTALL, NET_DNS_EXFIL]]
    # 클라우드·CI 토큰 + 어떤 외부 호출이든
    - all: [[ENV_ACCESS_SECRET_KEY], [NET_OUTBOUND_CALL]]
  description_ko: "같은 파일에서 정보 수집과 외부 전송이 함께 등장 (수집 + 전송 결합)"
  false_positive_hint: "토큰으로 공식 API를 호출하는 정상 코드는 두 번째 조합에서 제외되도록 설계"

# ---------- 난독화 (OBFUSCATION) ----------
- id: OBF_EVAL_DYNAMIC
  category: OBFUSCATION
  severity: HIGH
  languages: [JS, PY]
  pattern: '(?<![.\w$])(?:eval|exec)\(\s*[A-Za-z_$(\[]|(?<![.\w$])compile\([^)\n]*,\s*[''"](?:exec|eval|single)[''"]|\bnew\s+Function\(\s*[A-Za-z_$(\[]|\bvm\.runIn(?:This|New)?Context\(|\bexecSync\(\s*[A-Za-z_$(\[]'
  # 정상 관용구: 버전 파일 exec(open(..)), 네임스페이스를 넘기는 코드 생성 exec(code, ns), AST로만 컴파일
  exclude_pattern: '^\s*(?://|#)|exec\(\s*(?:open\(|compile\(\s*open\(|f\.read\(\)|fp\.read\(\)|fh\.read\(\)|Path\([^)\n]*\)\.read_text\(\))|(?<![.\w$])(?:eval|exec)\(\s*[\w.]+\s*,\s*[\w*{]|PyCF_ONLY_AST|\beval\(\s*line\b|version\w*\s*=\s*eval\('
  description_ko: "문자열이 아닌 동적 값을 코드로 실행 (eval/exec/new Function/vm)"
  false_positive_hint: "정규식 .exec()·re.compile()·버전 파일 exec·네임스페이스 지정 코드 생성은 제외"

- id: OBF_BASE64_DECODE_EXEC
  category: OBFUSCATION
  severity: CRITICAL
  mode: window
  window: 5
  languages: [JS, PY, SHELL]
  pattern: '\batob\(|Buffer\.from\([^)\n]*[''"]base64[''"]|\b(?:base64\.)?b64decode\(|\bbase64\s+(?:-d|--decode)|codecs\.decode\([^)\n]*base64'
  with_pattern: '(?<![.\w])(?:eval|exec)\(|\bnew\s+Function\(|\bvm\.runIn|\brequire\(\s*[^''"]|__import__\(|\|\s*(?:ba)?sh\b|\bsubprocess\.|\bos\.system\(|\bchild_process\b'
  description_ko: "base64 디코딩 결과를 5줄 이내에서 실행 (디코딩 + 실행 결합)"
  false_positive_hint: "디코딩 후 단순 파일 저장·표시는 해당 없음"

- id: OBF_LONG_B64_LITERAL
  category: OBFUSCATION
  severity: MEDIUM
  languages: [JS, PY, SHELL, OTHER]
  pattern: '[''"`][A-Za-z0-9+/]{200,}={0,2}[''"`]'
  exclude_pattern: 'data:[\w/+.-]+;base64,|integrity|sha(?:256|384|512)-'
  description_ko: "200자 이상의 base64 문자열 리터럴 (숨긴 코드·페이로드 의심)"
  false_positive_hint: "이미지 data URI, SRI 해시는 제외"

- id: OBF_HEX_ESCAPE_STRING
  category: OBFUSCATION
  severity: MEDIUM
  languages: [JS, PY, SHELL, OTHER]
  # 이스케이프 20개 이상 연속, 또는 인쇄 가능한 문자를 \x로 6글자 이상 연속 표기(이름·명령 숨기기)
  pattern: '(?:\\x[0-9a-fA-F]{2}){20,}|(?:\\u[0-9a-fA-F]{4}){20,}|(?:\\x[2-7][0-9a-fA-F]){6,}|(?:\\(?:1[0-7][0-7]|0?[4-7][0-7])){4,}'
  exclude_pattern: '\bb[''"]\\x|\[\\x[0-9a-fA-F]{2}-\\x'
  description_ko: "\\x·\\u 이스케이프로 문자열·이름을 숨김"
  false_positive_hint: "바이트 리터럴(b'\\x..')·정규식 문자 범위는 제외"

- id: OBF_STRING_SPLIT_JOIN
  category: OBFUSCATION
  severity: MEDIUM
  languages: [JS, PY]
  pattern: 'String\.fromCharCode\((?:\s*\d+\s*,){9,}|\[(?:\s*[''"][^''"\n]{1,3}[''"]\s*,){7,}\s*[''"][^''"\n]{1,3}[''"]\s*\]\.join\(|(?:chr\(\d+\)\s*\+\s*){7,}'
  description_ko: "글자를 잘게 쪼개 조립 (fromCharCode 나열, 문자 배열 join, chr 체인)"
  false_positive_hint: "키보드 레이아웃·문자표 데이터는 정상일 수 있음"

- id: OBF_CHARCODE_ARITH
  category: OBFUSCATION
  severity: MEDIUM
  languages: [JS, PY]
  pattern: 'fromCharCode\([^)\n]{0,40}\^|\bchr\([^)\n]{0,40}\^|\bord\([^)\n]{0,20}\)\s*\^|charCodeAt\([^)\n]{0,10}\)\s*\^'
  description_ko: "문자 코드에 XOR 연산 (간단한 암호화로 문자열 숨기기)"
  false_positive_hint: "체크섬·해시 구현 코드는 정상일 수 있음"

- id: OBF_HEX_ENCODED_WORD
  category: OBFUSCATION
  severity: MEDIUM
  languages: [JS, PY]
  # 영문자 코드만으로 된 16진 문자열 리터럴 ('72657175697265' = require) — 함수·모듈 이름 숨기기
  pattern: '[''"](?:(?:4[1-9a-fA-F]|5[0-9aA]|6[1-9a-fA-F]|7[0-9aA]|5[fF]|2[eE])){3,40}[''"]'
  description_ko: "영문자 코드만으로 된 16진 문자열 (함수·모듈 이름을 숨김)"
  false_positive_hint: "해시·색상 값은 무작위라 이 형태가 되기 어려움"

- id: OBF_JS_OBFUSCATOR_IDENT
  category: OBFUSCATION
  severity: MEDIUM
  languages: [JS]
  # javascript-obfuscator류 도구가 만드는 _0x 식별자와 배열 회전 관용구
  # + 문자열 배열 회전용 "숫자+글자" 배열, JSFuck류 기호만으로 된 코드
  pattern: '\b_0x[0-9a-f]{4,6}\b|\[[''"](?:shift|push)[''"]\]\(|\[\s*(?:[''"]\d{3,}[A-Za-z]{1,10}[''"]\s*,\s*){4,}|[\[\]()!+]{60,}'
  description_ko: "자동 난독화 도구가 남기는 _0x 식별자·배열 회전 코드"
  false_positive_hint: "일반 압축(minify) 코드는 _0x 이름을 쓰지 않음"

- id: OBF_DYNAMIC_LOOKUP_CALL
  category: OBFUSCATION
  severity: HIGH
  languages: [JS, PY]
  # 실행 함수를 이름 문자열로 꺼내 호출 (__import__('os'), getattr(builtins,'exec'), globals()['eval'], global['eval'])
  pattern: '__import__\(\s*[''"](?:os|subprocess|base64|zlib|marshal|socket|builtins|codecs|ctypes)[''"]\s*\)|getattr\(\s*(?:__builtins__|builtins|globals\(\)|__import__)|\b(?:globals|locals|vars)\(\)\s*\[\s*[''"](?:eval|exec|compile|__import__)[''"]|\[\s*[''"](?:eval|exec|compile|system|popen|execSync|spawn)[''"]\s*\]\s*\(|\b(?:global|globalThis|window|this)\[\s*[''"](?:eval|require|Function)[''"]\s*\]'
  exclude_pattern: '^\s*(?://|#)'
  description_ko: "실행 함수를 이름 문자열로 꺼내 호출 (탐지 우회용 동적 조회)"
  false_positive_hint: "플러그인 로더의 __import__(변수)는 해당 없음(고정 모듈명만 매칭)"

- id: SYSINFO_COLLECT
  category: ENV_EXFILTRATION
  severity: LOW
  languages: [JS, PY]
  pattern: '\bsocket\.gethostname\(|\bgetpass\.getuser\(|\bos\.getlogin\(|\bplatform\.(?:node|uname)\(|\bos\.uname\(|\bos\.hostname\(\)|\bos\.userInfo\(|\bos\.networkInterfaces\(|\bos\.homedir\(\)'
  description_ko: "호스트 이름·사용자 이름 등 시스템 정보 수집 (단독으로는 정상 — 결합 판단용 보조 룰)"
  false_positive_hint: "로그·설정 경로 계산에 흔함. 태그를 만들지 않고 결합 룰의 재료로만 쓴다"

- id: NET_DNS_EXFIL
  category: C2_CONNECTION
  severity: MEDIUM
  languages: [JS, PY]
  # 조립한 이름으로 DNS 조회 — 데이터를 서브도메인에 실어 보내는 DNS 유출
  pattern: '(?:dns\.resolver\.(?:resolve|query)|\bresolver\.(?:resolve|query)|socket\.gethostbyname(?:_ex)?|socket\.getaddrinfo|\bdns\.(?:lookup|resolve\w*))\(\s*(?:f[''"]|[\w.\[\]()]+\s*\+|[''"][^''"\n]*[''"]\s*(?:\+|%|\.format\()|`[^`\n]*\$\{)'
  description_ko: "데이터를 붙여 만든 이름으로 DNS 조회 (DNS 터널링·유출 의심)"
  false_positive_hint: "설정값으로 호스트 이름만 조회하는 경우는 변수 단독이라 해당 없음"

- id: SYSINFO_TO_NET
  category: ENV_EXFILTRATION
  severity: MEDIUM
  mode: combo
  languages: [JS, PY]
  combos:
    # API 키 읽기 + 요청은 SDK의 정상 패턴이라 넣지 않는다
    - all: [[SYSINFO_COLLECT], [NET_OUTBOUND_CALL, NET_DNS_EXFIL]]
  description_ko: "같은 파일에서 호스트·사용자 정보를 모은 뒤 외부로 요청 (사람 확인 필요)"
  false_positive_hint: "SDK·모니터링 도구는 정상일 수 있음 — 주의(MEDIUM)로 LLM 판단"

- id: OBF_LONG_LINE
  category: OBFUSCATION
  severity: MEDIUM
  languages: [JS, PY, SHELL, OTHER]
  # gateway 전처리가 2000자 넘는 줄을 잘라 붙이는 표시. 사람이 쓴 코드에는 거의 없는 한 줄 덩어리
  pattern: '…\[OBFUSCATION_SUSPECT \d+자\]'
  description_ko: "한 줄이 2000자를 넘는 코드 덩어리 (번들·난독화된 페이로드 의심)"
  false_positive_hint: "빌드 산출물(dist/·*.min.js)은 gateway에서 이미 제외. 남은 경우는 LLM 판단"

# ---------- 설치 훅 (INSTALL_HOOK) ----------
- id: INSTALL_HOOK_ADDED
  category: INSTALL_HOOK
  severity: HIGH
  languages: [CONFIG]
  path_pattern: '(?:^|/)package\.json$'
  pattern: '"(?:preinstall|install|postinstall|prepare|preuninstall|postuninstall)"\s*:'
  exclude_pattern: 'husky|node-gyp|\btsc\b|npm run build|patch-package|ngcc|lefthook|simple-git-hooks|lerna bootstrap|is-ci|only-allow'
  description_ko: "package.json에 설치 시 자동 실행되는 스크립트(preinstall/postinstall 등) 추가"
  false_positive_hint: "husky·node-gyp·빌드 스크립트 같은 흔한 정상 훅은 제외"

- id: INSTALL_HOOK_SHELL
  category: INSTALL_HOOK
  severity: CRITICAL
  languages: [CONFIG]
  path_pattern: '(?:^|/)package\.json$'
  pattern: '"(?:preinstall|install|postinstall|prepare)"\s*:\s*"[^"\n]*(?:\bcurl\s|\bwget\s|\bsh\s+-c|\bbash\s+-c|powershell|\bnode\s+-e|\bpython3?\s+-c|\|\s*(?:ba)?sh\b)'
  description_ko: "설치 훅에서 셸·다운로드·인라인 코드를 바로 실행"
  false_positive_hint: "설치 훅에서 인라인 실행은 정상 사례가 드묾"

- id: INSTALL_SETUP_EXEC
  category: INSTALL_HOOK
  severity: HIGH
  languages: [PY]
  path_pattern: '(?:^|/)setup\.py$'
  # setup.py의 프로세스 실행 중, 같은 줄에 내려받기·네트워크·디코딩·셸 래퍼·실행 파일이 함께 있는 것만.
  # 빌드·배포 명령(twine, cmake, pip freeze, pandoc)은 흔한 정상 관용구라 제외된다
  pattern: '\bos\.(?:system|popen)\(|\bsubprocess\.(?:run|call|Popen|check_output|check_call|getoutput)\(|\bcmdclass\s*=\s*\{[^}\n]*[''"]install[''"]'
  also_pattern: '\b(?:curl|wget|powershell|certutil|bitsadmin|mshta|nc|ncat)\b|\b(?:ba)?sh\s+-c\b|python3?\s+-c\b|base64|b64decode|https?://|\.(?:exe|ps1|vbs|bat|scr)\b|/tmp/|\bstart\s+\S+\.exe|cmdclass'
  description_ko: "setup.py(설치 시 실행)에서 내려받기·네트워크·디코딩이 섞인 명령 실행 또는 install 명령 바꿔치기"
  false_positive_hint: "빌드·배포 보조 명령(twine·cmake·pandoc 등)은 제외"

- id: PY_PTH_STARTUP_EXEC
  category: INSTALL_HOOK
  severity: HIGH
  languages: [OTHER]
  path_pattern: '\.pth$'
  # .pth 파일의 import 줄은 파이썬이 시작될 때마다 자동 실행된다
  pattern: '^\s*import\s'
  exclude_pattern: '__editable__|_virtualenv|distutils-precedence|_distutils_hack'
  description_ko: ".pth 파일에 실행 코드 추가 — 파이썬을 켤 때마다 자동 실행됨"
  false_positive_hint: "편집 가능 설치(__editable__)·virtualenv 내부 .pth는 제외"

# ---------- 다운로드 실행 (DOWNLOAD_EXECUTE) ----------
- id: DL_EXEC_PIPE
  category: DOWNLOAD_EXECUTE
  severity: CRITICAL
  languages: [JS, PY, CONFIG, OTHER]
  pattern: '\b(?:curl|wget)\b[^\n|]{0,200}\|\s*(?:sudo\s+)?(?:ba|z)?sh\b|\b(?:curl|wget)\b[^\n|]{0,200}\|\s*python3?\b|Invoke-WebRequest[^\n|]{0,200}\|\s*iex\b|\biex\s*\(\s*(?:New-Object\s+Net\.WebClient|iwr)'
  description_ko: "내려받은 스크립트를 파이프로 바로 실행 (curl | sh)"
  false_positive_hint: "README의 공식 설치 안내는 문서 배수(0.2)로 약화. 셸·Dockerfile·CI는 전용 룰"

- id: DL_WRITE_THEN_EXEC
  category: DOWNLOAD_EXECUTE
  severity: HIGH
  mode: window
  window: 8
  languages: [JS, PY, SHELL, MAKE]
  # 파일을 (바이너리로) 쓰거나 내려받은 뒤 8줄 이내에서 실행 권한 부여·실행
  pattern: '\b(?:curl|wget)\s[^\n]*(?:\s-o\s|\s-O\s|--output)|\burlretrieve\(|\bopen\([^)\n]*[''"]wb[''"]|createWriteStream\(|writeFileSync\([^)\n]*\.(?:exe|sh|bin)'
  with_pattern: '\bchmod\s+\+?[0-7]*x|\bchmod\(\s*[^,\n]+,\s*0o?7|\bos\.chmod\(|\bspawn\(|\bexecFile\(|\bsubprocess\.(?:run|Popen|call|check_call)\(|\bos\.system\(|\bos\.startfile\(|\bPopen\('
  description_ko: "파일을 내려받거나 쓴 뒤 8줄 이내에서 실행 권한 부여·실행"
  false_positive_hint: "공식 바이너리 설치 스크립트는 정상일 수 있음 — 출처 URL을 LLM이 판단"

- id: DL_EXECUTABLE_URL
  category: DOWNLOAD_EXECUTE
  severity: HIGH
  languages: [JS, PY, SHELL, OTHER]
  pattern: '\bhttps?://[^\s''"`<>]+\.(?:exe|scr|msi|bat|cmd|ps1|vbs|dll|jar)\b(?![\w.-])'
  exclude_pattern: '^\s*(?://|#)|github\.com/[\w.-]+/[\w.-]+/releases/download/|python\.org/ftp/|nodejs\.org/dist/'
  description_ko: "실행 파일(.exe·.ps1·.vbs 등)을 직접 내려받는 주소"
  false_positive_hint: "공식 배포처(GitHub Releases·python.org·nodejs.org)는 제외"

# ---------- 지속성 (PERSISTENCE) ----------
- id: PERSIST_CRON_RC
  category: PERSISTENCE
  severity: HIGH
  languages: [JS, PY, OTHER]
  # 셸 시작 파일·cron·자동 실행 위치에 "쓰는" 동작만 (파일 이름 언급은 제외)
  pattern: '(?:open\([^)\n]*|appendFile(?:Sync)?\([^)\n]*|writeFile(?:Sync)?\([^)\n]*|\.write_text\(|shutil\.copy\w*\([^)\n]*)(?:\.bashrc|\.zshrc|\.bash_profile|\.profile|/etc/rc\.local|/etc/cron|LaunchAgents|LaunchDaemons|Startup)|\bcrontab\s+(?:-l|-e|-\s|\S+\.\w+)|schtasks\s+/create|reg(?:\.exe)?\s+add\s+[^\n]*\\Run\b|CurrentVersion\\\\Run|\bsystemctl\s+enable\b'
  exclude_pattern: '^\s*(?://|#)'
  description_ko: "셸 시작 파일·cron·자동 실행 위치에 내용을 써서 재부팅 후에도 남도록 설정"
  false_positive_hint: "파일 이름을 목록으로 언급하는 것(문법 강조기 등)은 해당 없음. 셸 스크립트는 SH_HIDDEN_WRITE"

# ---------- 백도어 (BACKDOOR) ----------
- id: BACKDOOR_HARDCODED_AUTH
  category: BACKDOOR
  severity: HIGH
  languages: [JS, PY]
  # 이름이 password/secret/key/token으로 "끝나는" 변수를 비밀값처럼 생긴 리터럴(공백 없음, 6자+)과 비교
  pattern: '\b\w*(?:password|passwd|secret|api_?key|apikey|auth_?token|access_?token|admin_?token)\s*(?:===?|!==?)\s*[''"][^''"\s]{6,}[''"]|\btoken\s*(?:===?|!==?)\s*[''"][\w-]{16,}[''"]|[''"][^''"\s]{6,}[''"]\s*===?\s*\w*(?:password|secret|api_?key)\b|headers\[[''"]x-[\w-]+[''"]\]\s*===?\s*[''"]'
  exclude_pattern: '[''"](?:undefined|null|string|object|number|boolean|bearer|basic|none|password|token|secret)[''"]|typeof|^\s*assert\b'
  description_ko: "비밀번호·토큰을 코드에 박아 비교 (숨은 인증 우회)"
  false_positive_hint: "typeof 비교·설정 상태 문자열·assert는 제외. 테스트 파일은 배수 0.5"

- id: BACKDOOR_VALIDATION_REMOVED
  category: BACKDOOR
  severity: MEDIUM
  target: removed
  languages: [JS, PY]
  pattern: '\b(?:verify|validate|checkSignature|signature|checksum|authenticate|isAuthorized|checkAuth|csrf)\w*\('
  unless_added_pattern: '\b(?:verify|validate|checkSignature|signature|checksum|authenticate|isAuthorized|checkAuth|csrf)\w*\('
  description_ko: "검증·인증 호출이 삭제되고 대체 코드가 없음"
  false_positive_hint: "같은 파일에 다른 검증 호출이 추가되면(리팩토링) 제외"

- id: TIME_BOMB
  category: BACKDOOR
  severity: MEDIUM
  mode: window
  window: 6
  languages: [JS, PY]
  pattern: '\bnew\s+Date\([^)\n]*\)\s*[<>]|\bDate\.now\(\)\s*[<>]|\.getTime\(\)\s*[<>]|\bdatetime\.(?:now|today|utcnow)\(\)\s*[<>]|\btime\.time\(\)\s*[<>]'
  with_pattern: '\bfetch\(|\bhttps?\.request\(|\brequests\.|\burlopen\(|(?<![.\w])(?:eval|exec)\(|\bchild_process\b|\bsubprocess\.|\bos\.system\(|\bspawn\(|\bexecSync\('
  description_ko: "특정 날짜 이후에만 네트워크·실행이 일어나도록 분기 (시한폭탄)"
  false_positive_hint: "만료 처리·캐시 TTL 비교는 정상일 수 있음"

# ---------- 공급망 (SUPPLY_CHAIN) ----------
- id: TYPO_DEP_ADDED
  category: SUPPLY_CHAIN
  severity: MEDIUM
  mode: detector
  detector: typosquat
  languages: [CONFIG]
  path_pattern: '(?:^|/)(?:package\.json|requirements[\w.-]*\.txt|pyproject\.toml)$'
  description_ko: "인기 패키지와 이름이 1~2글자 다른 의존성 추가 (타이포스쿼팅 의심)"
  false_positive_hint: "allow 목록(preact, request 등 실존 유사명)은 제외"
  params:
    # 생태계별 비교 (npm 이름을 PyPI 목록과 비교하지 않는다). 스코프 패키지(@scope/x)는 대상 아님
    popular_npm: [react, lodash, express, axios, chalk, commander, moment, webpack, typescript, eslint, jquery,
                  debug, dotenv, cross-env, yargs, mongoose, nodemon, prettier, underscore, bluebird, minimist,
                  request, coffee-script, discord.js, electron, puppeteer, colors, node-fetch, ethers, web3]
    popular_pypi: [requests, numpy, pandas, django, flask, urllib3, setuptools, boto3, pyyaml, cryptography,
                   beautifulsoup4, scipy, matplotlib, pillow, colorama, jinja2, pytest, selenium, tensorflow,
                   discord.py, python-dateutil, openai, httpx, aiohttp]
    allow: [preact, redux, reactor, eclint, jshint, vitest, express-session, moment-timezone, chalk-template,
            dotenv-cli, ethers-v5, numba, flask-cors, django-environ, pytest-cov, tensorboard, httpcore, aiohttp-retry,
            colorette, colord, axe, react-is, requests-oauthlib]

- id: DEP_GIT_URL
  category: SUPPLY_CHAIN
  severity: MEDIUM
  languages: [CONFIG]
  path_pattern: '(?:^|/)(?:package\.json|requirements[\w.-]*\.txt|pyproject\.toml)$'
  pattern: '^\s*"[@\w./-]+"\s*:\s*"(?:git\+|git://|github:|https?://)|^\s*(?:git\+https?://|https?://\S+\.(?:whl|tar\.gz|zip)\b)|\s@\s*(?:git\+|https?://)'
  exclude_pattern: '"(?:homepage|url|repository|bugs|funding|author|\$schema|registry|publishConfig|email|twitter|github|website|blog|docs|documentation|changelog|license)"\s*:'
  description_ko: "의존성을 공식 레지스트리 대신 git·http 주소에서 설치"
  false_positive_hint: "homepage·repository 같은 메타 URL은 제외"

# ---------- 회피 (EVASION) ----------
- id: ENV_CHECK_EVASION
  category: EVASION
  severity: MEDIUM
  languages: [JS, PY, SHELL]
  pattern: '(?:process\.env|os\.environ|os\.getenv)\W{1,4}(?:CI|GITHUB_ACTIONS|GITLAB_CI|TRAVIS|JENKINS_URL|BUILDKITE|CIRCLECI)\b[^\n]{0,60}?(?:process\.exit|sys\.exit|\breturn\b|\bexit\b)|/\.dockerenv|/proc/1/cgroup|\bIsDebuggerPresent\b|PTRACE_TRACEME'
  description_ko: "CI·컨테이너·디버거 환경을 감지하면 조기 종료 (분석 회피)"
  false_positive_hint: "테스트 코드의 CI 분기는 배수 0.5. 로그 레벨 조정처럼 종료하지 않는 분기는 해당 없음"
