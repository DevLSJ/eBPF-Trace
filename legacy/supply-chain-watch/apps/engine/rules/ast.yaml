# 파이썬 AST 데이터 흐름 룰 (docs/03 §3.4 2차, Phase 3-7). 구현: app/static/ast_py.py
# 정규식 룰이 "같은 줄·몇 줄 안"만 보는 한계를 보완한다. 추가된 줄 전체가 파이썬으로 파싱될 때만 동작.

- id: AST_SENSITIVE_TO_NET
  category: ENV_EXFILTRATION
  severity: CRITICAL
  mode: detector
  detector: py_flow
  params: {flow: sensitive_to_net}
  languages: [PY]
  description_ko: "환경변수·시스템 정보·자격증명 파일 내용이 변수를 거쳐 네트워크 전송으로 흘러감 (구문 분석)"
  false_positive_hint: "모니터링 SDK가 호스트 이름을 보내는 경우는 LLM 판단"

- id: AST_DECODE_TO_EXEC
  category: OBFUSCATION
  severity: CRITICAL
  mode: detector
  detector: py_flow
  params: {flow: decode_to_exec}
  languages: [PY]
  description_ko: "base64·hex·압축 해제한 값이 변수를 거쳐 코드·명령 실행으로 흘러감 (구문 분석)"
  false_positive_hint: "디코딩한 설정을 실행할 정상 이유는 드묾"

- id: AST_DOWNLOAD_TO_EXEC
  category: DOWNLOAD_EXECUTE
  severity: CRITICAL
  mode: detector
  detector: py_flow
  params: {flow: download_to_exec}
  languages: [PY]
  description_ko: "내려받은 내용이 실행되거나, 파일로 저장된 뒤 그 파일이 실행됨 (구문 분석)"
  false_positive_hint: "설치 도구가 공식 바이너리를 받아 실행하는 경우는 LLM 판단"
