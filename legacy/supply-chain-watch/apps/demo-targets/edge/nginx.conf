# 입구 서버(edge) — 모바일 앱이 부르는 단일 진입점. /api/pay → 결제, /api/image → 이미지 (docs/13 §8)
server {
    listen 80;
    server_tokens off;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"svc":"edge"}';
    }

    location /api/pay/ {
        proxy_pass http://carrot-pay-service:3000/;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/image/ {
        client_max_body_size 6m;
        proxy_pass http://carrot-image-service:8000/;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
